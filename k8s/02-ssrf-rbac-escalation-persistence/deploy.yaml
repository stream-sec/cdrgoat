---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-code
  namespace: cdrgoat-sc02
data:
  app.py: |
    from flask import Flask, request, Response
    import urllib.request, ssl

    app = Flask(__name__)

    @app.route("/")
    def index():
        return "<h1>DataSync v3.2</h1><p>Internal data synchronization service.</p>"

    @app.route("/health")
    def health():
        return "OK"

    @app.route("/fetch", methods=["GET", "POST"])
    def fetch():
        """Proxy endpoint - fetches content from a given URL.
        Supports file:// for local config reads (intentionally vulnerable)."""
        url = request.args.get("url", "")
        if not url:
            return "Missing 'url' parameter", 400
        try:
            ctx = ssl.create_default_context()
            ctx.check_hostname = False
            ctx.verify_mode = ssl.CERT_NONE
            headers = {}
            for h in ["Authorization", "Content-Type", "Accept"]:
                val = request.headers.get(h)
                if val:
                    headers[h] = val
            body = request.get_data() or None
            if request.method == "GET":
                body = None
            req = urllib.request.Request(url, data=body, headers=headers, method=request.method)
            resp = urllib.request.urlopen(req, context=ctx, timeout=30)
            data = resp.read()
            ct = resp.headers.get("Content-Type", "text/plain")
            return Response(data, content_type=ct)
        except Exception as e:
            return str(e), 500

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)

---
apiVersion: v1
kind: Pod
metadata:
  name: web-app
  namespace: cdrgoat-sc02
  labels:
    app: web-app
    tier: frontend
spec:
  serviceAccountName: web-app-sa
  containers:
    - name: web-app
      image: python:3.11-slim
      command:
        - sh
        - -c
        - |
          pip install --quiet flask &&
          python /app/app.py
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: app-code
          mountPath: /app
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
  volumes:
    - name: app-code
      configMap:
        name: web-app-code

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: attack-whitelist
  namespace: cdrgoat-sc02
spec:
  podSelector:
    matchLabels:
      app: web-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0        # <-- CHANGE THIS to your IP/32
      ports:
        - port: 8080
          protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: web-app-svc
  namespace: cdrgoat-sc02
spec:
  type: LoadBalancer
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
