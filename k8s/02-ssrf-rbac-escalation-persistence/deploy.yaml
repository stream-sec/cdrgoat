##############################################################################
# CDRGoat K8S-02: SSRF on Web App -> RBAC Escalation -> Secret Exfil -> Persistence
#
# Deploy:  kubectl apply -f deploy.yaml
# Destroy: kubectl delete -f deploy.yaml
#
# Prerequisites: A running Kubernetes cluster (EKS, GKE, AKS, or on-prem)
# Wait for pods to become Ready before running attack.sh (~60s for pip install)
#
# IMPORTANT: Replace ATTACKER_CIDR below with your IP (e.g., 203.0.113.42/32)
#            to restrict access to the vulnerable web app.
#            Find your IP: curl -s ifconfig.me
##############################################################################

---
apiVersion: v1
kind: Namespace
metadata:
  name: cdrgoat-sc02
  labels:
    app.kubernetes.io/part-of: cdrgoat
    scenario: "02-ssrf-rbac-escalation-persistence"

---
# Target namespace with secrets to exfiltrate
apiVersion: v1
kind: Namespace
metadata:
  name: cdrgoat-sc02-prod
  labels:
    app.kubernetes.io/part-of: cdrgoat
    scenario: "02-ssrf-rbac-escalation-persistence"
    tier: production

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-app-sa
  namespace: cdrgoat-sc02

---
# ClusterRole with overly broad permissions (simulates Helm chart misconfiguration)
# The dangerous permission: create clusterrolebindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdrgoat-sc02-web-app-role
  labels:
    app.kubernetes.io/part-of: cdrgoat
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["list", "bind"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdrgoat-sc02-web-app-crb
  labels:
    app.kubernetes.io/part-of: cdrgoat
subjects:
  - kind: ServiceAccount
    name: web-app-sa
    namespace: cdrgoat-sc02
roleRef:
  kind: ClusterRole
  name: cdrgoat-sc02-web-app-role
  apiGroup: rbac.authorization.k8s.io

